<svg xmlns="http://www.w3.org/2000/svg" width="680" height="424" viewBox="0 0 680 424" role="img" font-family="Pretendard, -apple-system, 'Helvetica Neue', sans-serif">
  <title>FWL 정리: 통제한다는 것은 그 방향의 성분을 제거하는 것</title>
  <desc>x2 방향을 가로축으로 두고, y와 x1에서 각각 x2 방향 성분을 제거하여 남은 잔차 r_y와 r_x를 그린 그림. 이 두 잔차 사이의 기울기가 다중회귀 계수와 같다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="50" y="58" font-size="14" font-weight="500" fill="#111827">"경력(x₂)을 통제한다" = x₂ 방향 성분을 양쪽에서 빼버린다</text>

  <!-- x2 축 -->
  <line x1="70" y1="320" x2="620" y2="320" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="311" font-size="14" fill="#6B7280">x₂ 방향</text>

  <!-- 원래 벡터 (옅게) -->
  <line x1="110" y1="320" x2="430" y2="120" stroke="#6B4FBB" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="110" y1="320" x2="320" y2="215" stroke="#1A6FC4" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="438" y="116" font-size="14" font-weight="500" fill="#6B4FBB">y</text>
  <text x="326" y="206" font-size="14" font-weight="500" fill="#1A6FC4">x₁</text>

  <!-- 남은 잔차 (굵게) -->
  <line x1="430" y1="320" x2="430" y2="120" stroke="#6B4FBB" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="320" y1="320" x2="320" y2="215" stroke="#1A6FC4" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="442" y="228" font-size="14" font-weight="500" fill="#6B4FBB">r_y</text>
  <text x="332" y="280" font-size="14" font-weight="500" fill="#1A6FC4">r_x</text>

  <!-- 직각 표시 -->
  <path d="M416,320 L416,306 L430,306" fill="none" stroke="#6B7280" stroke-width="0.8"/>
  <path d="M306,320 L306,306 L320,306" fill="none" stroke="#6B7280" stroke-width="0.8"/>

  <!-- 원점 -->
  <circle cx="110" cy="320" r="3" fill="#111827"/>
  <text x="92" y="338" font-size="14" fill="#111827">O</text>

  <!-- 축 설명 -->
  <text x="130" y="345" font-size="12" fill="#6B7280">이 방향으로 설명되는 부분은 y 에서도, x₁ 에서도 떼어냅니다</text>

  <!-- 결론 -->
  <line x1="50" y1="368" x2="630" y2="368" stroke="#E5E7EB" stroke-width="1"/>
  <text x="50" y="391" font-size="14" font-weight="500" fill="#111827">남은 것끼리의 기울기 = β̂₁ (다중회귀의 교육 계수와 정확히 같음)</text>
  <text x="50" y="411" font-size="12" fill="#6B7280">점선 = 원래 벡터 · 실선 = x₂ 성분을 제거하고 남은 부분</text>
</svg>
