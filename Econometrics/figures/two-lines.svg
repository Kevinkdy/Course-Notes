<svg xmlns="http://www.w3.org/2000/svg" width="680" height="424" viewBox="0 0 680 424" role="img" font-family="Pretendard, -apple-system, 'Helvetica Neue', sans-serif">
  <title>모집단 회귀함수와 표본 회귀선</title>
  <desc>왼쪽은 한 표본의 산점도 위에 보이지 않는 진짜 선(점선)과 자료로 그은 표본 회귀선(실선)을 함께 그린 그림. 오른쪽은 표본을 일곱 번 다시 뽑았을 때 표본 회귀선이 매번 달라지는 모습으로, 점선은 그대로 고정되어 있다.</desc>

  <!-- 패널 제목 -->
  <text x="70" y="68" font-size="14" font-weight="500" fill="#111827">표본 하나로 선을 그으면</text>
  <text x="390" y="68" font-size="14" font-weight="500" fill="#111827">표본을 다시 뽑을 때마다</text>

  <!-- 왼쪽 축 -->
  <line x1="70" y1="82" x2="70" y2="300" stroke="#D1D5DB" stroke-width="1"/>
  <line x1="70" y1="300" x2="325" y2="300" stroke="#D1D5DB" stroke-width="1"/>

  <!-- 왼쪽 관측치 -->
  <g fill="#6B7280">
    <circle cx="302.6" cy="91.3" r="3.2"/>
    <circle cx="172.5" cy="168.2" r="3.2"/>
    <circle cx="110.5" cy="242.1" r="3.2"/>
    <circle cx="100.3" cy="213.9" r="3.2"/>
    <circle cx="138.6" cy="224.4" r="3.2"/>
    <circle cx="259.2" cy="190.6" r="3.2"/>
    <circle cx="159.8" cy="229.8" r="3.2"/>
    <circle cx="298.9" cy="151.1" r="3.2"/>
    <circle cx="121.5" cy="222.2" r="3.2"/>
    <circle cx="186.0" cy="191.8" r="3.2"/>
    <circle cx="122.8" cy="227.6" r="3.2"/>
    <circle cx="135.9" cy="208.0" r="3.2"/>
    <circle cx="255.0" cy="203.3" r="3.2"/>
    <circle cx="106.2" cy="224.1" r="3.2"/>
    <circle cx="184.8" cy="206.4" r="3.2"/>
    <circle cx="103.6" cy="236.5" r="3.2"/>
    <circle cx="208.3" cy="185.5" r="3.2"/>
    <circle cx="86.9" cy="282.1" r="3.2"/>
    <circle cx="301.9" cy="155.3" r="3.2"/>
    <circle cx="154.6" cy="244.5" r="3.2"/>
    <circle cx="225.7" cy="173.8" r="3.2"/>
    <circle cx="149.9" cy="226.1" r="3.2"/>
  </g>

  <!-- 왼쪽: 표본 회귀선, 그리고 보이지 않는 진짜 선 -->
  <line x1="77.5" y1="252.2" x2="312.5" y2="139.1" stroke="#1A6FC4" stroke-width="2.5"/>
  <line x1="77.5" y1="266.1" x2="312.5" y2="143.9" stroke="#111827" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- 오른쪽 축 -->
  <line x1="390" y1="82" x2="390" y2="300" stroke="#D1D5DB" stroke-width="1"/>
  <line x1="390" y1="300" x2="640" y2="300" stroke="#D1D5DB" stroke-width="1"/>

  <!-- 오른쪽: 표본마다 달라지는 선들 -->
  <g stroke="#1A6FC4" stroke-width="2" opacity="0.4">
    <line x1="397.5" y1="252.4" x2="632.5" y2="145.4"/>
    <line x1="397.5" y1="283.1" x2="632.5" y2="130.6"/>
    <line x1="397.5" y1="254.5" x2="632.5" y2="143.2"/>
    <line x1="397.5" y1="270.2" x2="632.5" y2="136.7"/>
    <line x1="397.5" y1="260.0" x2="632.5" y2="144.1"/>
    <line x1="397.5" y1="266.4" x2="632.5" y2="151.3"/>
    <line x1="397.5" y1="266.9" x2="632.5" y2="151.9"/>
  </g>
  <line x1="397.5" y1="266.1" x2="632.5" y2="143.9" stroke="#111827" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- 축 설명 -->
  <text x="197" y="320" font-size="12" fill="#6B7280" text-anchor="middle">x (교육연수)</text>
  <text x="515" y="320" font-size="12" fill="#6B7280" text-anchor="middle">x (교육연수)</text>

  <!-- 범례 -->
  <line x1="50" y1="352" x2="76" y2="352" stroke="#111827" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="86" y="357" font-size="14" fill="#111827">β₀ + β₁x — 모집단 회귀함수 · 고정되어 있지만 보이지 않음</text>

  <line x1="50" y1="378" x2="76" y2="378" stroke="#1A6FC4" stroke-width="2.5"/>
  <text x="86" y="383" font-size="14" fill="#1A6FC4">ŷ = β̂₀ + β̂₁x — 표본 회귀선 · 자료로 계산하지만 표본마다 달라짐</text>

  <text x="50" y="409" font-size="12" fill="#6B7280">점선은 한 자리에 있고, 파란 선만 흔들립니다. 그 흔들림의 크기가 표준오차입니다.</text>
</svg>
